name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install Miri
      run: |
        rustup toolchain install nightly --component miri
        cargo +nightly miri setup

    - name: Run clippy
      run: cargo clippy

    - name: Run tests
      run: cargo test
      
    - name: Run miri test
      run: cargo +nightly miri test --test stream --test try_stream
